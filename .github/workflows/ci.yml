name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        working-directory: android
        run: ./gradlew test

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          mkdir -p keystore
          echo "${{ secrets.OPENPAY_KEYSTORE_BASE64 }}" | base64 -d > keystore/openpay-release.keystore
          ./gradlew assembleRelease \
            -PstoreFile=keystore/openpay-release.keystore \
            -PstorePassword="${{ secrets.OPENPAY_STORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.OPENPAY_KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.OPENPAY_KEY_PASSWORD }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openpay-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: openpay-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
